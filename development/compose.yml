services:
  express-app:
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ..:/usr/src/app:delegated
      - node_modules:/usr/src/app/node_modules
    env_file:
      - ../.env
    command: sh -c "npm i && npm run dev"

volumes:
  node_modules: